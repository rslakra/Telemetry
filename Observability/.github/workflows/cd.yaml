name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  HELM_CHART_NAME: observability

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://grafana.staging.example.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (if using EKS)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # Uncomment for EKS
    # - name: Update kubeconfig for EKS
    #   run: |
    #     aws eks update-kubeconfig --name staging-cluster --region us-west-2

    # Uncomment for GKE
    # - name: Authenticate to Google Cloud
    #   uses: google-github-actions/auth@v1
    #   with:
    #     credentials_json: ${{ secrets.GCP_SA_KEY }}
    #
    # - name: Setup gcloud CLI
    #   uses: google-github-actions/setup-gcloud@v1
    #
    # - name: Get GKE credentials
    #   run: |
    #     gcloud container clusters get-credentials staging-cluster --zone us-central1-a

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'

    - name: Deploy to Staging
      run: |
        helm upgrade --install ${{ env.HELM_CHART_NAME }} ./helm/observability \
          --namespace observability \
          --create-namespace \
          --values ./helm/observability/values.yaml \
          --wait \
          --timeout 15m

    - name: Verify deployment
      run: |
        kubectl get pods -n observability
        kubectl wait --for=condition=ready pod -l app=prometheus -n observability --timeout=300s
        kubectl wait --for=condition=ready pod -l app=grafana -n observability --timeout=300s

    - name: Run health checks
      run: |
        # Add your health check commands here
        kubectl exec -n observability deployment/prometheus -- wget -q -O- http://localhost:9090/-/healthy

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://grafana.example.com
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (if using EKS)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # Uncomment for EKS
    # - name: Update kubeconfig for EKS
    #   run: |
    #     aws eks update-kubeconfig --name production-cluster --region us-west-2

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'

    - name: Deploy to Production
      run: |
        helm upgrade --install ${{ env.HELM_CHART_NAME }} ./helm/observability \
          --namespace observability \
          --create-namespace \
          --values ./helm/observability/values.yaml \
          --values ./helm/observability/values-production.yaml \
          --wait \
          --timeout 20m

    - name: Verify deployment
      run: |
        kubectl get pods -n observability
        kubectl wait --for=condition=ready pod -l app=prometheus -n observability --timeout=600s
        kubectl wait --for=condition=ready pod -l app=grafana -n observability --timeout=600s

    - name: Run smoke tests
      run: |
        # Add your smoke test commands here
        echo "Running production smoke tests..."

    - name: Notify deployment
      if: always()
      run: |
        # Add notification logic (Slack, email, etc.)
        echo "Production deployment completed"

