apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

# Use base configurations
resources:
  - ../../base/namespace.yaml
  - ../../base/prometheus
  - ../../base/grafana
  - ../../base/loki
  - ../../base/tempo
  - ../../base/alertmanager
  - ../../base/kube-state-metrics
  # Exclude node-exporter - not compatible with GKE Autopilot hostNetwork restrictions
  # Exclude promtail - requires privileged access

# Remove ServiceMonitor (requires Prometheus Operator CRDs)
patches:
  # Remove node-exporter DaemonSet (uses hostNetwork/hostPID - not allowed in Autopilot)
  - target:
      kind: DaemonSet
      name: node-exporter
    patch: |
      $patch: delete
      
  # Remove node-exporter Service
  - target:
      kind: Service
      name: node-exporter
    patch: |
      $patch: delete

  # Remove promtail DaemonSet (uses privileged containers - not allowed in Autopilot)
  - target:
      kind: DaemonSet
      name: promtail
    patch: |
      $patch: delete

  # Remove ServiceMonitor (CRD not installed)
  - target:
      kind: ServiceMonitor
    patch: |
      $patch: delete

  # Update Prometheus config to remove node-exporter scrape job
  - target:
      kind: ConfigMap
      name: prometheus-config
    patch: |
      - op: replace
        path: /data/prometheus.yml
        value: |
          global:
            scrape_interval: 15s
            scrape_timeout: 10s
            evaluation_interval: 15s
            external_labels:
              cluster: 'gke-autopilot-cluster'
              environment: 'production'

          alerting:
            alertmanagers:
            - kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                  - observability
              relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                regex: alertmanager
                action: keep

          rule_files:
            - '/etc/prometheus/rules/*.yml'

          scrape_configs:
          # Prometheus itself
          - job_name: 'prometheus'
            static_configs:
            - targets: ['localhost:9090']

          # Kubernetes API server
          - job_name: 'kubernetes-apiservers'
            kubernetes_sd_configs:
            - role: endpoints
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            relabel_configs:
            - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: default;kubernetes;https

          # Kubernetes pods with annotations
          - job_name: 'kubernetes-pods'
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: kubernetes_pod_name

          # kube-state-metrics
          - job_name: 'kube-state-metrics'
            static_configs:
            - targets: ['kube-state-metrics.observability.svc.cluster.local:8080']

          # cAdvisor (container metrics via kubelet)
          - job_name: 'kubernetes-cadvisor'
            kubernetes_sd_configs:
            - role: node
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

commonLabels:
  app.kubernetes.io/part-of: observability-stack
  platform: gke-autopilot

