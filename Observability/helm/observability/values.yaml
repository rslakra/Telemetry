# Default values for observability stack

global:
  namespace: observability

prometheus:
  enabled: true
  replicas: 2
  image:
    repository: prom/prometheus
    tag: v2.47.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  storage:
    size: 50Gi
    storageClass: ""
  retention: 15d
  nodeSelector: {}
  tolerations: []
  affinity: {}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: 10.1.4
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: ""
  adminUser: admin
  adminPassword: admin  # Change in production!
  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

loki:
  enabled: true
  replicas: 2
  image:
    repository: grafana/loki
    tag: 2.9.2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  storage:
    size: 50Gi
    storageClass: ""
  retention: 336h

tempo:
  enabled: true
  replicas: 1
  image:
    repository: grafana/tempo
    tag: 2.2.3
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  storage:
    size: 30Gi
    storageClass: ""

alertmanager:
  enabled: true
  replicas: 2
  image:
    repository: prom/alertmanager
    tag: v0.26.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ""
  config:
    slack:
      webhook_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#alerts"
    pagerduty:
      service_key: "YOUR_PAGERDUTY_SERVICE_KEY"

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.6.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - effect: NoSchedule
      operator: Exists

kubeStateMetrics:
  enabled: true
  replicas: 1
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.10.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: 2.9.2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - effect: NoSchedule
      operator: Exists

